behaviors:
  Fly_up:
    trainer_type: ppo
    hyperparameters:
      batch_size: 50
      buffer_size: 500
      learning_rate: 3.0e-4
      beta: 5.0e-4
      epsilon: 0.2
      lambd: 0.99
      num_epoch: 3
      learning_rate_schedule: linear
      beta_schedule: constant
      epsilon_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.90
        strength: 1.0
    max_steps: 5000000
    time_horizon: 64
    summary_freq: 10000